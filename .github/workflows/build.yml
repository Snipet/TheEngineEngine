# Builds TheEngineEngine and runs every test on macOS (Apple silicon), Windows (x64, clang-cl) and Linux (x86-64,
# Ubuntu 24.04), on every push to main and to a claude/** branch, on every pull request, and by hand. Modelled on
# TestingPlayground's build.yml.
#
# FMinus's LLVM comes prebuilt: the archive for the platform from FMinus's release deps-llvm-<TEE_LLVM_VERSION>,
# checked against its SHA-256 (scripts/fetch-llvm.sh); with it come Bison and Flex (WinFlexBison on Windows). Nothing
# builds LLVM. Everything else is fetched at its pin (cmake/TeePins.cmake).
#
# Linux is the cloud containers' own recipe: scripts/bootstrap-cloud.sh on Ubuntu 24.04, then the preset. So a run
# that passes there is the proof that a fresh container can build with one script.
#
# Two caches keep a warm run to minutes (actions/cache's restore and save, apart):
#
#   sources   the dependencies' sources in the dependency cache's src/ (FMinus, FunkGui, Catch2, nlohmann/json, and
#             FMinus's own four): key sources-<platform>-<hash of cmake/TeePins.cmake>. Saved by a run that missed.
#   compiler  the compilers' objects, through CMake's compiler launchers: ccache on macOS and Linux (CCACHE_DIR; the
#             compiler told apart by its --version), sccache on Windows (ccache refuses clang-cl's /clang: options, and
#             cmake/TeeFlags.cmake passes one). sccache is pinned: its release's archive is checked against the SHA-256
#             written below. Key ccache-<platform>-<hash of cmake/TeePins.cmake>-<commit>, restored from the newest with
#             the same pins, else the newest of the platform. Saved after every build that succeeded on a push (the
#             branches share nothing else), and by a pull request only when nothing was restored. At most 500 MB each.
#   shaderc   bgfx's shader compiler, which FunkGui's and the panels' shaders are built with: the build's slowest
#             part by far (about 2,000 CPU-seconds), kept as the prebuilt one shell/cmake/TeeGpu.cmake looks for,
#             tools/shaderc-<bgfx.cmake's version>/ in the dependency cache with its shaderc.stamp. Key
#             shaderc-<platform>-<bgfx.cmake's commit>. A run that missed builds it first and saves it at once,
#             whatever happens to the rest of the run.
#
# A push or a pull request that changes only files under docs/, or only *.md files, starts nothing (paths-ignore): no
# build or test reads them. Each platform queues on its own (the build job's concurrency group names the platform):
# a platform's job in flight always finishes, and a newer push replaces only that platform's job still waiting, so a
# slow platform (macOS, which may wait for a runner) never holds back the others' results. A run whose job was
# replaced shows "cancelled" for that platform alone; scripts/ci-status.sh reads each platform's newest finished job.
#
# main is moved forward by the lead alone, at each checkpoint, to a commit the integration branch already carries
# (docs/plan/01-rules.md section 2): its run builds, tests and packs the fast tier on every platform, for the owner's
# artefacts and main's own green mark, and skips the soak tier, which the integration branch's runs already give that
# commit (and which would hold a Linux runner for the longest job twice).
#
# The soak tier (the [nightly] tests, ctest --preset nightly, about 95 minutes on Linux) runs only when asked, so
# that each soak result belongs to a named commit, not to whichever tip was current when the last soak ended
# (docs/plan/01-rules.md section 3):
#   a push          soaks nothing, unless its head commit's message says [soak] (Linux) or [soak-all] (all three);
#                   the content agent's baked push, the candidate for main, says [soak]
#   by hand         tier: fast (the default), soak, or both, on the platforms named
#   each night      03:23 UTC, the integration branch's tip, Linux (a schedule runs main's copy of this file, so the
#                   build job checks out claude/awesome-gates-ntdb58 for it)
# The soak summary names the commit it ran on.
#
# On Linux the preset's tree is built right after the configure, before the application: a compile error anywhere
# fails the run in about three minutes instead of eight (every session's push lands here; docs/plan/01-rules.md §3).
#
# Each platform's run uploads what it built as an artefact, kept 14 days (tee-<platform>: the build's bin/ folder
# without the test executables: tee-render, tee-bench, tee-headless and, when TEE_BUILD_APP is on, the application,
# with sim/ and content/ beside them, where each looks for them), and writes tee-bench's quick table into the run's
# summary and its log: what the reference costs on a hosted runner. The artefact is packed and uploaded whenever the
# build succeeded, whether or not a test then failed: the job still fails. A failed run keeps its test log and out/.
#
# The application (TEE_BUILD_APP; docs/plan/w1-b-shell.md, docs/checkpoints/M1.md) is built first, in a tree of its
# own (build-app: the preset with TEE_BUILD_APP=ON, no tools, no tests), and uploaded at once, so that its artefact
# exists whatever the rest of the build and the tests do, and so that the preset's own tree stays what every checkout
# builds by default (no GPU layer: the interface's pictures there are the software rasteriser's):
#   TheEngineEngine-windows-x64   a folder: TheEngineEngine.exe, tee-headless.exe, sim/, content/, licences/, the
#                                 Visual C++ runtime's DLLs, README.txt
#   TheEngineEngine-macos-arm64   TheEngineEngine-macos-arm64.tar.gz (a zip loses the executable bit): the same with
#                                 TheEngineEngine.app, signed ad hoc, sim/ and content/ in its Resources
#   TheEngineEngine-linux-x64     TheEngineEngine-linux-x64.tar.gz: the same with the executable
# and from macOS and Linux TheEngineEngine-mcpb-<platform>: TheEngineEngine.mcpb, the Claude Desktop extension (card
# A's tee-mcpb: manifest.json and server/tee-mcp), checked before it is kept;
# and, from every platform, TheEngineEngine-listen-<platform>: the reference and the simulator started, revved and
# stopped by tee-headless, as WAV files and pictures, and what the window's own run on the runner said and drew (Linux: on
# Xvfb with Mesa's software Vulkan, which must work; macOS and Windows: reported, and no reason to fail the job).
#
# Run by hand (Actions, Build, Run workflow), `platforms` builds only the platforms named (macos-arm64, windows-x64,
# linux-x64; spaces or commas between them; "all", the default, every one), and `tier` says which tiers: fast (the
# default), soak or both. From a shell: gh api -X POST repos/<owner>/<repo>/actions/workflows/build.yml/dispatches
# -f ref=<branch> -f 'inputs[tier]=soak' -f 'inputs[platforms]=linux-x64'.
#
# Each action is pinned to its release's full commit SHA, with the tag in a comment: a tag can be moved, a SHA cannot.
name: Build

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      platforms:
        description: "The platforms to build: all, or some of macos-arm64 windows-x64 linux-x64"
        type: string
        default: all
      tier:
        description: "The tiers: fast (the default tests), soak (the [nightly] tests) or both"
        type: choice
        options: [fast, soak, both]
        default: fast
  # the nightly soak of the integration branch's tip (see the header)
  schedule:
    - cron: "23 3 * * *"

# nothing by default; each job asks for what it needs
permissions: {}

# (the queue is the build job's, a platform at a time: see the comment at the top)

jobs:
  # the platforms to build: every one, but by hand with `platforms`
  platforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      # jobs: the build's at once; tests: the tests' (the Mac has 3 cores)
      - id: platforms
        shell: bash
        env:
          ONLY: ${{ inputs.platforms || (github.event_name == 'schedule' && 'linux-x64') || 'all' }}
          TIER: ${{ inputs.tier || 'fast' }}
          EVENT: ${{ github.event_name }}
          # (the head commit's message, by the environment, never pasted into the script)
          MESSAGE: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref }}
          ALL: >-
            [
              {"platform": "macos-arm64", "os": "macos-latest", "jobs": 3, "tests": 3},
              {"platform": "windows-x64", "os": "windows-latest", "jobs": 4, "tests": 4},
              {"platform": "linux-x64", "os": "ubuntu-24.04", "jobs": 4, "tests": 4}
            ]
        run: |
          names=$(printf '%s\n' "$ONLY" | tr ', ' '\n\n' | sed '/^$/d' | sort -u)
          if [ -z "$names" ] || [ "$names" = all ]; then
            matrix=$(jq -c . <<< "$ALL")
          else
            for n in $names; do
              jq -e --arg n "$n" 'any(.[]; .platform == $n)' <<< "$ALL" > /dev/null || {
                echo "::error::no platform $n: platforms takes all, or some of $(jq -r 'map(.platform) | join(" ")' <<< "$ALL")"
                exit 1; }
            done
            matrix=$(jq -c --arg names "$names" '($names | split("\n")) as $n | map(select(.platform as $p | any($n[]; . == $p)))' <<< "$ALL")
          fi
          # two tiers (docs/plan/01-rules.md §3): `fast`, the default tests; `soak`, the [nightly] tests (ctest
          # --preset nightly), only when asked (see the header): a push's [soak] or [soak-all], by hand, each night
          fast=true; soak='[]'
          case "$EVENT" in
            push|pull_request)
              case "$MESSAGE" in
                *"[soak-all]"*) soak='["linux-x64","macos-arm64","windows-x64"]' ;;
                *"[soak]"*) soak='["linux-x64"]' ;;
              esac
              # main moves only forward to a commit the integration branch already carries and has soaked: main
              # builds, tests and packs the fast tier on every platform (the owner's artefacts), and soaks nothing
              [ "$REF" = refs/heads/main ] && soak='[]' ;;
            workflow_dispatch)
              case "$TIER" in
                soak) fast=false; soak=$(jq -c 'map(.platform)' <<< "$matrix") ;;
                both) soak=$(jq -c 'map(.platform)' <<< "$matrix") ;;
              esac ;;
            schedule) fast=false; soak='["linux-x64"]' ;;
          esac
          matrix=$(jq -c --argjson soak "$soak" --argjson fast "$fast" \
            '(if $fast then map(. + {tier: "fast"}) else [] end)
             + map(select(.platform as $p | $soak | index($p)) + {tier: "soak"})' <<< "$matrix")
          [ "$(jq length <<< "$matrix")" -gt 0 ] || { echo "::error::nothing to build"; exit 1; }
          echo "building: $(jq -r 'map(.platform + " " + .tier) | join(", ")' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}${{ matrix.tier == 'soak' && '-soak' || '' }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    # the fast tier fits 90 minutes with room; the soak tier ([nightly], ctest --preset nightly) ran past 90 on
    # 2026-11-24 and was stopped in its Test step with nothing reported, so it gets 240 (a hosted runner's limit is 360)
    timeout-minutes: ${{ matrix.tier == 'soak' && 240 || 90 }}
    permissions:
      contents: read
    # a platform's job in flight finishes; only its newest waiting one is kept (a pull request's newer push replaces
    # even the one in flight)
    concurrency:
      group: ${{ matrix.tier == 'soak' && 'soak' || 'build' }}-${{ github.event_name == 'schedule' && 'refs/heads/claude/awesome-gates-ntdb58' || github.ref }}-${{ matrix.platform }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PRESET: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the nightly soak runs main's copy of this file on the integration branch's tip
          ref: ${{ github.event_name == 'schedule' && 'claude/awesome-gates-ntdb58' || '' }}

      # the platform rules a Linux build cannot see (M_PI's kin is the configure's: cmake/TeeChecks.cmake), in a
      # second, before the macOS and Windows jobs would find them
      - name: Lint (Linux, scripts/lint.sh)
        if: matrix.tier == 'fast' && runner.os == 'Linux'
        run: scripts/lint.sh

      - name: Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          for tool in ninja ccache; do
            command -v "$tool" || HOMEBREW_NO_AUTO_UPDATE=1 brew install "$tool"
          done
          cmake --version | head -1

      # sccache's release, checked against the SHA-256 its release published (the archive's .sha256), written here so
      # that a replaced archive fails the run; a new version changes all three lines
      - name: sccache (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: v0.19.0
          SHA256: 130e4f8eb672e76590e9993c2ab890c4763b88238577bb11d8062158c7698353
        run: |
          name="sccache-${VERSION}-x86_64-pc-windows-msvc"
          cd "$RUNNER_TEMP"   # relative names below: Git Bash's tar takes D:\... for a remote host
          curl -fsSL --retry 3 -o "$name.tar.gz" "https://github.com/mozilla/sccache/releases/download/${VERSION}/$name.tar.gz"
          echo "$SHA256  $name.tar.gz" | sha256sum -c
          tar -xzf "$name.tar.gz"
          exe=$(cygpath -m "$RUNNER_TEMP/$name/sccache.exe")
          "$exe" --version
          echo "TEE_SCCACHE=$exe" >> "$GITHUB_ENV"

      - name: Visual Studio's environment and its clang-cl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = 'Microsoft.VisualStudio.Component.VC.Llvm.Clang'
          $vs = & $vswhere -latest -products * -requires $clang -property installationPath
          if (-not $vs) { throw "no Visual Studio with its C++ Clang tools" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          "$vs\VC\Tools\Llvm\x64\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8   # its clang-cl first

      # the dependency cache and the compiler's cache, outside the checkout
      - name: The caches' folders and keys
        id: keys
        run: |
          deps="$RUNNER_TEMP/tee-deps"
          if [ "$RUNNER_OS" = Windows ]; then deps=$(cygpath -m "$deps"); fi
          mkdir -p "$deps/src" "$deps/install" "$deps/tools"
          echo "TEE_DEPS_DIR=$deps" >> "$GITHUB_ENV"
          # bgfx.cmake's pin names the shader compiler's cache and its folder (shell/cmake/TeeGpu.cmake)
          bgfx_sha=$(grep -A4 '^tee_pin(bgfx_cmake' cmake/TeePins.cmake | sed -nE 's/^ *COMMIT +([0-9a-f]{40}).*/\1/p')
          bgfx_version=$(grep -A4 '^tee_pin(bgfx_cmake' cmake/TeePins.cmake | sed -nE 's/^ *VERSION +([^ )]+).*/\1/p')
          [ -n "$bgfx_sha" ] && [ -n "$bgfx_version" ] || { echo "::error::no bgfx_cmake pin in cmake/TeePins.cmake"; exit 1; }
          echo "bgfx_sha=$bgfx_sha" >> "$GITHUB_OUTPUT"
          echo "bgfx_version=$bgfx_version" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = Windows ]; then
            dir=$(cygpath -m "$RUNNER_TEMP/sccache")
            mkdir -p "$dir"
            echo "cache=sccache" >> "$GITHUB_OUTPUT"
            {
              echo "TEE_CI_CACHE=$dir"
              echo "SCCACHE_DIR=$dir"
              echo "SCCACHE_CACHE_SIZE=500M"
              # one server for the whole Build step (its statistics are the run's), stopped at its end; a server
              # that fails leaves the compile to clang-cl, uncached, rather than failing the build
              echo "SCCACHE_IDLE_TIMEOUT=0"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            } >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/ccache"
            echo "cache=ccache" >> "$GITHUB_OUTPUT"
            {
              echo "TEE_CI_CACHE=$RUNNER_TEMP/ccache"
              echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
              echo "CCACHE_MAXSIZE=500M"
              # the compiler by what it says it is, not by its file's time (Apple's clang is a shim)
              echo "CCACHE_COMPILERCHECK=string:$(clang --version | cksum | cut -d' ' -f1)"
            } >> "$GITHUB_ENV"
          fi

      - name: Restore the dependencies' sources
        id: sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_DEPS_DIR }}/src
          key: sources-${{ matrix.platform }}-${{ hashFiles('cmake/TeePins.cmake') }}

      - name: Restore the compiler's cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_CI_CACHE }}
          key: ${{ steps.keys.outputs.cache }}-${{ matrix.platform }}-${{ hashFiles('cmake/TeePins.cmake') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.keys.outputs.cache }}-${{ matrix.platform }}-${{ hashFiles('cmake/TeePins.cmake') }}-
            ${{ steps.keys.outputs.cache }}-${{ matrix.platform }}-

      - name: Restore the shader compiler
        id: shaderc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_DEPS_DIR }}/tools/shaderc-${{ steps.keys.outputs.bgfx_version }}
          key: shaderc-${{ matrix.platform }}-${{ steps.keys.outputs.bgfx_sha }}

      # Linux: the cloud containers' script, whole (apt, CMake, LLVM, the sources by git)
      - name: Bootstrap (Linux, scripts/bootstrap-cloud.sh)
        if: runner.os == 'Linux'
        run: scripts/bootstrap-cloud.sh

      - name: FMinus's LLVM, Bison and Flex (prebuilt; macOS and Windows)
        if: runner.os != 'Linux'
        run: scripts/fetch-llvm.sh ${{ matrix.platform }}

      - name: Configure
        run: |
          cmd=(cmake --preset "$PRESET" -DTEE_DEPS_DIR="$TEE_DEPS_DIR")
          if [ "$RUNNER_OS" = Windows ]; then
            cmd+=(-DCMAKE_C_COMPILER_LAUNCHER="$TEE_SCCACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$TEE_SCCACHE")
          else
            cmd+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          "${cmd[@]}"

      # Linux: the preset's tree at once, so that a compile error anywhere (a header many include) fails the run here,
      # in minutes; the Build step below then has nothing left to do there. The compiler cache's statistics start here.
      - name: Build first (Linux), to fail fast on a compile error
        if: runner.os == 'Linux'
        run: |
          ccache -z
          cmake --build --preset "$PRESET" --parallel ${{ matrix.jobs }}

      # The application's own tree: the preset's settings with the window on, and neither the tools nor the tests
      # (the preset's tree builds and runs those). Before the sources are saved, so that bgfx's are among them.
      - name: Configure the application
        if: matrix.tier == 'fast'
        run: |
          cmd=(cmake --preset "$PRESET" -B build-app -DTEE_DEPS_DIR="$TEE_DEPS_DIR" -DTEE_BUILD_APP=ON
               -DTEE_BUILD_TOOLS=OFF -DTEE_BUILD_TESTS=OFF)
          if [ "$RUNNER_OS" = Windows ]; then
            cmd+=(-DCMAKE_C_COMPILER_LAUNCHER="$TEE_SCCACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$TEE_SCCACHE")
          else
            cmd+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          "${cmd[@]}"

      # a run that missed keeps the sources the two configures fetched
      - name: Save the dependencies' sources
        if: matrix.tier == 'fast' && steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_DEPS_DIR }}/src
          key: ${{ steps.sources.outputs.cache-primary-key }}

      # a run that missed builds the shader compiler first and keeps it at once as the prebuilt one the next configure
      # finds, so that a run that fails later has still warmed the slowest cache
      - name: Build the shader compiler
        id: build-shaderc
        if: matrix.tier == 'fast' && steps.shaderc.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.keys.outputs.bgfx_version }}
          SHA: ${{ steps.keys.outputs.bgfx_sha }}
        run: |
          cmake --build build-app --target shaderc --parallel ${{ matrix.jobs }}
          exe=shaderc; if [ "$RUNNER_OS" = Windows ]; then exe=shaderc.exe; fi
          found=$(/usr/bin/find build-app -type f -name "$exe" | head -1)
          echo "found: $found"
          [ -n "$found" ] || { echo "::warning::no $exe under build-app: not cached"; exit 0; }
          dir="$TEE_DEPS_DIR/tools/shaderc-$VERSION"
          mkdir -p "$dir"
          cp "$found" "$dir/$exe"
          echo "bgfx.cmake $SHA" > "$dir/shaderc.stamp"
          ls -l "$dir"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = Windows ]; then "$TEE_SCCACHE" --stop-server > /dev/null || true; fi

      - name: Save the shader compiler
        if: matrix.tier == 'fast' && steps.build-shaderc.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_DEPS_DIR }}/tools/shaderc-${{ steps.keys.outputs.bgfx_version }}
          key: ${{ steps.shaderc.outputs.cache-primary-key }}

      # The application first: its artefact exists whatever the rest of the build and the tests do. Many hands commit
      # to this branch and none of them can compile for Windows or macOS before they push, so a warning one of those
      # compilers alone raises would otherwise cost the artefact for a whole run: when the strict build fails, the
      # application is built once more with warnings as warnings (TEE_WERROR=OFF), said aloud. The preset's own tree
      # below is still built with warnings as errors, and fails on the warning as it should.
      - name: Build the application
        id: app
        if: matrix.tier == 'fast'
        run: |
          # (and on macOS and Linux the Claude Desktop extension, assistant/CMakeLists.txt's tee-mcpb)
          targets=(TheEngineEngine tee-headless)
          [ "$RUNNER_OS" = Windows ] || targets+=(tee-mcpb)
          build() { cmake --build build-app --target "${targets[@]}" --parallel ${{ matrix.jobs }}; }
          rc=0
          build || rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::the application did not build under -Werror on $RUNNER_OS: building it with TEE_WERROR=OFF for the artefact; the Build step will say what is wrong"
            cmake -S . -B build-app -DTEE_WERROR=OFF > /dev/null
            rc=0
            build || rc=$?
          fi
          if [ "$RUNNER_OS" = Windows ]; then "$TEE_SCCACHE" --stop-server > /dev/null || true; fi
          exit $rc

      # the application as someone would unpack and run it (docs/checkpoints/M1.md)
      - name: Pack the application
        id: pack-app
        if: matrix.tier == 'fast'
        env:
          TEE_PLATFORM: ${{ matrix.platform }}     # (not PLATFORM: Visual Studio's environment has a Platform of its own)
        run: |
          name="TheEngineEngine-$TEE_PLATFORM"
          bin="build-app/bin"
          out="$RUNNER_TEMP/app"
          dir="$out/$name"
          rm -rf "$out"; mkdir -p "$dir/licences"
          case "$RUNNER_OS" in
            macOS)
              cp -R "$bin/TheEngineEngine.app" "$dir/"
              cp "$bin/tee-headless" "$dir/"
              codesign --verify --deep --strict --verbose=2 "$dir/TheEngineEngine.app" \
                || echo "::warning::codesign does not verify TheEngineEngine.app"
              codesign -d --entitlements - "$dir/TheEngineEngine.app" 2>&1 | head -20 || true ;;
            Windows)
              cp "$bin/TheEngineEngine.exe" "$bin/tee-headless.exe" "$dir/"
              cp -R "$bin/sim" "$bin/content" "$dir/"
              # the Visual C++ runtime the executables link (LLVM's own choice), for a machine that has none
              crt=$(ls -d "$(cygpath -u "$VCToolsRedistDir")"x64/Microsoft.VC*.CRT 2>/dev/null | head -1)
              if [ -n "$crt" ]; then cp "$crt"/*.dll "$dir/"; else echo "::warning::no Visual C++ runtime folder found"; fi ;;
            *)
              cp "$bin/TheEngineEngine" "$bin/tee-headless" "$dir/"
              cp -R "$bin/sim" "$bin/content" "$dir/" ;;
          esac
          # the licences of what the executables hold: ours, FunkGui's font and bgfx (funkgui_add_font put them beside
          # the executable or in the bundle), and each dependency's own file from its source
          cp LICENSE "$dir/licences/TheEngineEngine-LICENSE.txt"
          [ -d "$bin/licences" ] && cp -R "$bin/licences/." "$dir/licences/" || true
          for src in "$TEE_DEPS_DIR"/src/*/; do
            dep=$(basename "$src")
            for f in LICENSE LICENSE.txt LICENSE.md LICENSE.TXT COPYING LICENSE.MIT LICENSE-MIT; do
              if [ -f "$src$f" ]; then cp "$src$f" "$dir/licences/$dep-$f"; fi
            done
          done
          llvm=$(ls -d "$TEE_DEPS_DIR"/install/llvm-*/ 2>/dev/null | head -1)
          cat > "$dir/licences/LLVM-NOTE.txt" << 'NOTE'
          The executables hold LLVM (https://llvm.org), which FMinus links: Apache License 2.0 with LLVM Exceptions,
          https://llvm.org/LICENSE.txt
          NOTE
          {
            echo "TheEngineEngine: a car engine simulator whose sound is the simulation's own."
            echo "Built by GitHub Actions from $GITHUB_REPOSITORY at $GITHUB_SHA ($GITHUB_REF_NAME), $TEE_PLATFORM."
            echo "What to check is docs/checkpoints/M1.md in the repository. In short:"
            echo
            case "$RUNNER_OS" in
              Windows)
                echo "Double-click TheEngineEngine.exe (a console window opens beside it and says what it found), or from"
                echo "a Command Prompt or PowerShell in this folder:"
                echo "    .\\TheEngineEngine.exe"
                echo "    .\\TheEngineEngine.exe --info" ;;
              macOS)
                echo "From Terminal, in this folder (the first line lets a downloaded application run):"
                echo "    xattr -dr com.apple.quarantine TheEngineEngine.app"
                echo "    open TheEngineEngine.app"
                echo "or, to see what it prints:"
                echo "    ./TheEngineEngine.app/Contents/MacOS/TheEngineEngine"
                echo "    ./TheEngineEngine.app/Contents/MacOS/TheEngineEngine --info" ;;
              *)
                echo "From a terminal in this folder (an X11 or XWayland display, a Vulkan driver, and ALSA, PulseAudio or"
                echo "PipeWire for the sound):"
                echo "    ./TheEngineEngine"
                echo "    ./TheEngineEngine --info" ;;
            esac
            echo
            echo "Press Return to start the engine (hold it a second to switch it off). Up or W is the throttle, Down or S"
            echo "the brake, E and Q shift up and down, N is neutral, 1 to 6 a gear. --ref-panel shows the reference"
            echo "engine in its own panel (the dashboard); --panel plain a plain panel of numbers and dials, which needs"
            echo "no shader; --engine tone plays a plain tone with no simulator, to tell a silent audio device from a"
            echo "simulator that did not start; --help lists the rest."
            echo
            echo "tee-headless is the same application with no window and no audio device: it renders a script of"
            echo "inputs to a WAV file and pictures (tee-headless --seconds 14 --wav engine.wav --shot engine.png)."
            echo
            echo "licences/ holds the licences of the code and the font in the executables."
          } > "$dir/README.txt"
          cat "$dir/README.txt"
          ls -la "$dir"
          cd "$out"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "path=$(cygpath -m "$dir")" >> "$GITHUB_OUTPUT"
          else
            # an artefact is a zip, which loses the executable bit and a bundle's links: a tar inside it keeps them
            tar -czf "$name.tar.gz" "$name"
            echo "path=$out/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload the application
        if: matrix.tier == 'fast'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack-app.outputs.name }}
          path: ${{ steps.pack-app.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # The Claude Desktop extension (card A, assistant/CMakeLists.txt's tee-mcpb; macOS and Linux): a zip of
      # manifest.json and server/tee-mcp, which Claude Desktop installs with a double click. Checked here: the manifest
      # parses as JSON and names server/tee-mcp, the server is executable in the zip, and on macOS it carries a
      # signature (ad hoc, the linker's on arm64) and the application's bundle still verifies beside it.
      - name: Check the Claude Desktop extension
        id: mcpb
        if: matrix.tier == 'fast' && runner.os != 'Windows' && steps.pack-app.outcome == 'success'
        run: |
          mcpb=build-app/TheEngineEngine.mcpb
          [ -f "$mcpb" ] || { echo "::error::no $mcpb: the tee-mcpb target did not build it"; exit 1; }
          x="$RUNNER_TEMP/mcpb"; rm -rf "$x"; mkdir -p "$x"
          (cd "$x" && unzip -q "$GITHUB_WORKSPACE/$mcpb")
          zipinfo "$mcpb"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); assert m["server"]["entry_point"] == "server/tee-mcp", m["server"]; print("manifest:", m["name"], m["version"], m["compatibility"])' "$x/manifest.json" \
            || { echo "::error::the extension's manifest.json is not valid JSON or does not name server/tee-mcp"; exit 1; }
          [ -x "$x/server/tee-mcp" ] || { echo "::error::server/tee-mcp is not executable in the extension"; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then
            codesign -dv "$x/server/tee-mcp" 2>&1 | grep -E 'Signature|flags|Identifier' \
              || { echo "::error::server/tee-mcp carries no signature: macOS on arm64 will not run it"; exit 1; }
            codesign --verify --strict --verbose=2 "$x/server/tee-mcp"
            codesign --verify --deep --strict --verbose=2 "${{ steps.pack-app.outputs.dir }}/TheEngineEngine.app" \
              || echo "::warning::codesign does not verify TheEngineEngine.app with the extension beside it"
          fi
          echo "path=$GITHUB_WORKSPACE/$mcpb" >> "$GITHUB_OUTPUT"

      - name: Upload the Claude Desktop extension
        if: matrix.tier == 'fast' && steps.mcpb.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheEngineEngine-mcpb-${{ matrix.platform }}
          path: ${{ steps.mcpb.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # What can be known of the application without a person: the reference started, revved and stopped by
      # tee-headless (a WAV to listen to, pictures from the software rasteriser), and the window itself run where the
      # runner allows. Linux: Xvfb, openbox and Mesa's software Vulkan, with SDL's dummy audio driver: it must work.
      # macOS and Windows: the runner's own session (Metal in a virtual machine; Direct3D 11's software adapter; no
      # sound card), reported and no reason to fail the job: those two are proven by a person running the artefact.
      - name: Run the application
        id: run-app
        if: matrix.tier == 'fast'
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          TEE_PLATFORM: ${{ matrix.platform }}
        run: |
          dir="${{ steps.pack-app.outputs.dir }}"
          out="$RUNNER_TEMP/listen"
          mkdir -p "$out"
          rc=0
          case "$RUNNER_OS" in
            macOS) app="$dir/TheEngineEngine.app/Contents/MacOS/TheEngineEngine"; headless="$dir/tee-headless" ;;
            Windows) app="$dir/TheEngineEngine.exe"; headless="$dir/tee-headless.exe" ;;
            *) app="$dir/TheEngineEngine"; headless="$dir/tee-headless" ;;
          esac
          # a command that has not ended after five minutes is stopped (a window that never draws would hold the job)
          limited() {
            "$@" & local pid=$!
            ( sleep 300; echo "::warning::stopped after five minutes: $*"; kill -9 "$pid" 2>/dev/null ) & local watch=$!
            local code=0; wait "$pid" || code=$?
            kill "$watch" 2>/dev/null || true
            return $code
          }
          echo "---- tee-headless: the reference through a start, a rev and a stop"
          limited "$headless" --engine ref --script tests/shell/scripts/start-rev-stop.txt \
              --wav "$out/reference-start-rev-stop-$TEE_PLATFORM.wav" --shot "$out/headless-end-$TEE_PLATFORM.png" --panel plain || rc=$?
          echo "---- tee-headless: the simulator the same way, in the application's frame"
          limited "$headless" --engine sim --script tests/shell/scripts/sim-start-rev-stop.txt \
              --wav "$out/simulator-start-rev-stop-$TEE_PLATFORM.wav" --shot "$out/headless-frame-$TEE_PLATFORM.png" || rc=$?
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(scripts/xvfb-run.sh); export SDL_AUDIODRIVER=dummy; fi
          echo "---- the window: --info"
          limited "${run[@]}" "$app" --info || rc=$?
          echo "---- the window: five seconds, the simulator started and revved in the frame, the last frame read back from the GPU"
          limited "${run[@]}" "$app" --script tests/shell/scripts/window.txt --frames 60 \
              --shot "$out/window-$TEE_PLATFORM.png" || rc=$?
          echo "---- the same with the reference in its own panel (its three shaders)"
          limited "${run[@]}" "$app" --ref-panel --script tests/shell/scripts/window.txt --frames 60 \
              --shot "$out/window-ref-panel-$TEE_PLATFORM.png" || rc=$?
          echo "---- the same with the plain Panel"
          limited "${run[@]}" "$app" --panel plain --script tests/shell/scripts/window.txt --frames 60 \
              --shot "$out/window-plain-$TEE_PLATFORM.png" || rc=$?
          ls -l "$out" || true
          exit $rc

      - name: Upload what the application rendered and drew
        if: matrix.tier == 'fast' && always() && steps.pack-app.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheEngineEngine-listen-${{ matrix.platform }}
          path: ${{ runner.temp }}/listen/
          retention-days: 30
          if-no-files-found: ignore

      # the compiler cache's statistics zeroed before and printed after, whatever the build's outcome: the run's hit
      # rate and the cache's size (sccache's server, started by the zeroing, is stopped after, so that its folder is
      # whole when it is saved)
      - name: Build
        id: build
        run: |
          cmd=(cmake --build --preset "$PRESET" --parallel ${{ matrix.jobs }})
          if [ "$RUNNER_OS" = Windows ]; then
            "$TEE_SCCACHE" --zero-stats || true
            rc=0; "${cmd[@]}" || rc=$?
            "$TEE_SCCACHE" --show-stats || true
            "$TEE_SCCACHE" --stop-server > /dev/null || true
            du -sh "$SCCACHE_DIR" || true
            exit $rc
          fi
          [ "$RUNNER_OS" = Linux ] || ccache -z   # Linux zeroed them before its first build
          rc=0; "${cmd[@]}" || rc=$?
          ccache -s
          exit $rc

      - name: Save the compiler's cache
        if: >-
          matrix.tier == 'fast' && success() && steps.cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEE_CI_CACHE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The fast tier: the default tests, and in the job's summary every one over 30 s with its package (the rule:
      # under 30 s a test, docs/plan/01-rules.md §3; the build steward tells the owners). The soak tier: the
      # [nightly] tests (ctest --preset nightly).
      - name: Test
        env:
          TIER: ${{ matrix.tier }}
        run: |
          preset="$PRESET"; [ "$TIER" = soak ] && preset=nightly
          log="$RUNNER_TEMP/ctest-$TIER.log"
          set +e
          ctest --preset "$preset" --parallel ${{ matrix.tests }} 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$TIER" = fast ]; then
            slow=$(sed -nE 's/^ *[0-9]+\/ *[0-9]+ Test +#[0-9]+: (.*[^ .]) \.+ *([A-Za-z*]+.*) +([0-9.]+) sec$/\3\t\1/p' "$log" \
                   | awk -F'\t' '$1 > 30' | sort -rn)
            {
              echo "### Default-run tests over 30 s ($(echo -n "$slow" | grep -c . || true))"
              echo
              if [ -n "$slow" ]; then
                echo "| s | package | test |"; echo "|---:|---|---|"
                echo "$slow" | awk -F'\t' '{ p = $2; sub(/[.:].*/, "", p); if (p == $2) p = "host"; printf "| %.0f | %s | %s |\n", $1, p, $2 }'
              else
                echo "none"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            [ -z "$slow" ] || { echo "---- default-run tests over 30 s (docs/plan/01-rules.md §3):"; echo "$slow"; }
            # each package's CPU-seconds against its budget (scripts/test-budget.sh: the lead's budgets)
            budget=$(scripts/test-budget.sh "$log" || true)
            { echo; echo "### The fast tier's time by package, against its budget (Linux's is the one that binds)"; echo; echo "$budget"; } >> "$GITHUB_STEP_SUMMARY"
            echo "---- the fast tier's time by package (docs/plan/01-rules.md §3):"; echo "$budget"
          fi
          if [ "$TIER" = soak ]; then
            # the failures by kind, each with its run and the tee-fuzz command that reproduces it (scripts/soak-summary.py)
            py=python3; command -v python3 > /dev/null || py=python
            # which commit this soak ran on (the checkout's: a nightly soak runs main's workflow on the branch's tip)
            head=$(git rev-parse HEAD)
            echo "### The soak tier at ${head::7} ($(git log -1 --format='%cI %s' | cut -c1-100))" >> "$GITHUB_STEP_SUMMARY"
            echo "soak tier at $head"
            "$py" scripts/soak-summary.py "$log" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::soak-summary.py did not run"
          fi
          exit $rc

      # what was built, as someone would unpack and run it: the build's bin/ without its tests, sim/ and content/
      # beside the executables (the application's build copies them there; a build without it gets them here)
      - name: Pack what was built
        id: pack
        if: ${{ matrix.tier == 'fast' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          out="tee-${{ matrix.platform }}"
          rm -rf "$out"
          cp -R "build-$PRESET/bin" "$out"
          rm -f "$out"/*-tests "$out"/*-tests.exe "$out"/*.pdb "$out"/*.ilk "$out"/*.lib "$out"/*.exp
          [ -d "$out/sim" ] || cp -R sim "$out/sim"
          [ -d "$out/content" ] || cp -R content "$out/content"
          cp LICENSE "$out/"
          ls -l "$out"
          ls "$out"/tee-render* > /dev/null || { echo "::error::no tee-render in build-$PRESET/bin"; exit 1; }
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # what the reference costs on this runner, in the run's summary and beside the tools (a hosted runner is a
      # shared machine: the numbers are a rough guide, not a measurement to quote)
      - name: The bench, quickly
        if: ${{ matrix.tier == 'fast' && !cancelled() && steps.pack.outcome == 'success' }}
        run: |
          dir="${{ steps.pack.outputs.dir }}"
          bench="$dir/tee-bench"
          [ -f "$bench" ] || bench="$bench.exe"
          "$bench" --quick --out "$dir/bench-quick.md"
          cat "$dir/bench-quick.md" >> "$GITHUB_STEP_SUMMARY"
          # the budget table again, scaled to the reference runner by this runner's own compile time (runners differ
          # by up to 1.4 times; scripts/test-budget.sh)
          if [ -f "$RUNNER_TEMP/ctest-fast.log" ]; then
            budget=$(scripts/test-budget.sh "$RUNNER_TEMP/ctest-fast.log" "$dir/bench-quick.md" || true)
            { echo; echo "### The fast tier by package, scaled to the reference runner"; echo; echo "$budget"; } >> "$GITHUB_STEP_SUMMARY"
            echo "---- the fast tier by package, scaled to the reference runner:"; echo "$budget"
          fi
          # R on this runner and the simulator's cost against it, from the same inputs (a number in the log, not a
          # gate: a hosted runner is shared; docs/handoffs/p0-keel.md, "Measuring a package's cost")
          echo "---- the simulator (sim/engine.fm, build default) against the reference, free revs"
          if "$bench" --engine --builds default --scenarios free-revs --repeat 1 --out "$dir/bench-engine.md"; then
            { echo; echo "### The simulator against R"; echo; cat "$dir/bench-engine.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::tee-bench --engine did not run"
          fi
          # the simulator's compile time and code size on this runner (tee-schema --compile: sim/ as the application
          # compiles it, every model's code in it), beside R
          schema="$dir/tee-schema"
          [ -f "$schema" ] || schema="$schema.exe"
          if [ -f "$schema" ] && line=$("$schema" --sim sim --compile); then
            echo "---- compiling the simulator: $line"
            { echo; echo "### Compiling the simulator (sim/engine.fm)"; echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::tee-schema --compile did not run"
          fi

      - name: Upload what was built
        if: ${{ matrix.tier == 'fast' && !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tee-${{ matrix.platform }}
          path: tee-${{ matrix.platform }}/
          retention-days: 14
          if-no-files-found: error

      - name: Keep the test log and what the tests wrote
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.platform }}${{ matrix.tier == 'soak' && '-soak' || '' }}
          path: |
            build-${{ env.PRESET }}/Testing/Temporary/LastTest*.log
            out/
          retention-days: 7
          if-no-files-found: ignore
